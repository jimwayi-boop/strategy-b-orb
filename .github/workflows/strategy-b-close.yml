name: Strategy B - Close Only

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strategy-b-close
  cancel-in-progress: false

jobs:
  close-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Force Close All Positions
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: python close_all.py

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          FILES_ADDED=0
          for f in dashboard_data.json equity_history.json shadow_trades.jsonl; do
            if [ -f "$f" ]; then
              git add -f "$f"
              echo "✅ 已暂存: $f"
              FILES_ADDED=$((FILES_ADDED+1))
            else
              echo "ℹ️ 文件不存在，跳过: $f"
            fi
          done

          if [ $FILES_ADDED -eq 0 ]; then
            echo "⚠️ 没有可提交的文件，退出"
            exit 0
          fi

          echo "───── git status ─────"
          git status

          if git diff --staged --quiet; then
            echo "ℹ️ 没有变化，跳过提交"
          else
            git commit -m "Update dashboard data [skip ci]"
            git push
            echo "✅ 已推送到远程"
          fi
